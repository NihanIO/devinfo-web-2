<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Beautiful Page</title>
    <style>
        /* CSS: This is the "Paint" of your house */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            background-color: #121212; /* Dark background */
            color: #e0e0e0; /* Light text */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            padding: 2rem;
            text-align: center;
            background: #1e1e1e;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            color: #bb86fc; /* Accent purple */
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        p {
            font-size: 1.1rem;
            color: #b0b0b0;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #03dac6; /* Teal button */
            color: #000;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn:hover {
            background-color: #018786;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to My Space</h1>
        <p>This is a basic HTML structure styled with modern CSS. It uses a dark theme, clean typography, and a responsive container to look great on both phones and desktops.</p>
        
        <a href="#" class="btn">Explore My Work</a>
    </div>

    <footer>
        &copy; 2026 Crafted with Gemini
    </footer>

</body>
</html>
